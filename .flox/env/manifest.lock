{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.18.0",
    "install": {
      "claude-code": {
        "pkg-path": "claude-code"
      },
      "jq": {
        "pkg-path": "jq"
      },
      "python3": {
        "pkg-path": "python3",
        "version": "3.14"
      },
      "redis": {
        "pkg-path": "redis"
      }
    },
    "vars": {
      "APP_PORT": "8080",
      "REDIS_PORT": "6379"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "app": {
        "command": "python3 app.py"
      },
      "redis": {
        "command": "redis-server --port $REDIS_PORT --dir $FLOX_ENV_CACHE/redis --save ''"
      }
    },
    "build": {
      "app": {
        "command": "mkdir -p $out/bin && cp app.py $out/bin/app && chmod +x $out/bin/app",
        "runtime-packages": [
          "python3",
          "redis"
        ],
        "sandbox": "pure",
        "version": "0.1.0"
      }
    }
  },
