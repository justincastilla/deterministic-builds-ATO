schema-version = "1.18.0"

[install]
python3.pkg-path = "python3"          # runtime
python3.version  = "3.14"
redis.pkg-path   = "redis"            # database
jq.pkg-path      = "jq"
claude-code.pkg-path = "claude-code"  # the agent's harness

[vars]
APP_PORT   = "8080"
REDIS_PORT = "6379"

[services.redis]
command = "redis-server --port $REDIS_PORT --dir $FLOX_ENV_CACHE/redis --save ''"
[services.app]
command = "python3 app.py"

[build.app]
version = "0.1.0"
command = "mkdir -p $out/bin && cp app.py $out/bin/app && chmod +x $out/bin/app"
sandbox = "pure"                      # hermetic
runtime-packages = ["python3", "redis"]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
